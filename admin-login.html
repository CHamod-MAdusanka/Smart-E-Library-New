<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Smart E-Library</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <div style="position: absolute; left: -9999px;">
        <input type="text" tabindex="-1">
        <input type="password" tabindex="-1">
    </div>

    <div class="top-bar">
        <a href="index.html">Home</a>
        <span class="divider">|</span>
        <a href="student-login.html">Student</a>
        <span class="divider">|</span>
        <a href="admin-login.html">Admin</a>
    </div>

    <div class="login-wrapper">
        <div class="login-box">
            <h2>Admin Login</h2>
            
            <form id="adminLoginForm" action="php/auth_controller.php?action=admin_login" method="POST">
                
                <div id="step-1">
                    <input type="text" name="adminId" id="adminId" placeholder="Admin ID" oninput="this.value = this.value.replace(/[^a-zA-Z0-9\-]/g, '')" onpaste="return false;" ondrop="return false;" autocomplete="new-password" data-lpignore="true" required>
                    <br>
                    <button type="button" class="login-btn" onclick="goToStep2()">Next</button>
                </div>

                <div id="step-2" style="display: none;">
                    <div id="display-id" style="font-weight: bold; color: #003366; margin-bottom: 15px; font-size: 16px;"></div>
                    
                    <input type="password" name="adminPassword" id="adminPassword" placeholder="Password" required>
                    <br>
                    <div class="forgot-password">
                        <a href="#" onclick="goToForgotPassword()">Forgot Password</a>
                    </div>
                    <button type="submit" class="login-btn">Login</button>
                </div>

            </form>
        </div>
    </div>

    <script>
        function goToStep2() {
            var typedId = document.getElementById("adminId").value.trim().toUpperCase();
            
            var validPattern = /^[A-Z0-9\-]+$/;
            
            if (typedId === "") {
                alert("Please enter your Admin ID first!");
                return;
            }
            
            if (!validPattern.test(typedId)) {
                alert("Security Alert: Invalid characters detected! Please use only letters, numbers, and hyphens (-).");
                return;
            }
            
            document.getElementById("display-id").textContent = "Hi, " + typedId;
            document.getElementById("step-1").style.display = "none";
            document.getElementById("step-2").style.display = "block";
        }

        function goToForgotPassword() {
            var typedId = document.getElementById("adminId").value.trim().toUpperCase();
            window.location.href = "forgot-password.html?id=" + encodeURIComponent(typedId);
        }
    </script>
</body>
</html>
