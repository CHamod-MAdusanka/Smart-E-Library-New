<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Smart E-Library</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@900&family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="login-wrapper">
        <div class="login-box" style="width: 450px;">
            <h2 style="color: var(--accent-teal); font-family: 'Roboto Slab', serif; font-size: 26px;">Smart E-Library</h2>
            
            <div id="step-password">
                <h3 style="margin-bottom: 10px; color: var(--bg-slate);">Reset Password</h3>
                <p style="color: #64748B; font-size: 14px; margin-bottom: 25px;">Please enter your new secure password below.</p>
                
                <input type="password" id="reset-new-password" placeholder="Enter new password">
                <input type="password" id="reset-confirm-password" placeholder="Confirm new password">
                
                <button class="login-btn" onclick="goToOtpStep()">Reset Password</button>
            </div>

            <div id="step-otp" style="display: none;">
                <h3 style="margin-bottom: 10px; color: var(--bg-slate);">OTP Verification</h3>
                <p style="color: #64748B; font-size: 14px; margin-bottom: 15px;">We have sent a verification code to:</p>
                
                <div style="background: var(--bg-light); border: 1px dashed #cbd5e1; padding: 10px; border-radius: 6px; margin-bottom: 20px; font-weight: bold; color: var(--bg-slate);" id="dynamic-email-display">admin@elibrary.com</div>
                
                <input type="text" id="otp-input" placeholder="• • • • • •" maxlength="6" style="text-align: center; font-size: 20px; letter-spacing: 5px; font-weight: bold;">
                
                <div style="margin: 15px 0; font-size: 14px; color: #475569;">
                    <span id="timer-text">OTP expires in: <strong id="countdown" style="color: #ef4444;">02:00</strong></span>
                    <button id="resend-btn" onclick="resendOtpAction()" style="display: none; background: #64748B; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">🔄 Resend OTP</button>
                </div>
                
                <button class="login-btn" onclick="verifyAndSubmit()">Verify & Confirm</button>
            </div>
            
            <div class="register-link">
                <a href="head-dashboard.php" id="dynamic-back-link">← Back to Dashboard</a>
            </div>
        </div>
    </div>

    <div id="success-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 2000;">
        <div style="background: white; padding: 30px; border-radius: 12px; text-align: center; max-width: 320px;">
            <div style="font-size: 50px; margin-bottom: 15px;">✅</div>
            <h3 style="margin-top: 0; color: var(--bg-slate);">Change Successful!</h3>
            <p style="color: #64748b; font-size: 14px; margin-bottom: 20px;">Your password has been securely updated in the system.</p>
            <button class="login-btn" onclick="redirectAfterSuccess()">OK</button>
        </div>
    </div>

    <script>
        let countdownTimer;
        let timeLeft = 120; 
        let returnUrl = "head-dashboard.php"; 

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const userId = urlParams.get('id');
            const backLink = document.getElementById('dynamic-back-link');
            const emailDisplay = document.getElementById('dynamic-email-display');

            if (userId) {
                if (userId.startsWith('STU')) {
                    backLink.textContent = "← Back to Student Login";
                    backLink.href = "student-login.php";
                    returnUrl = "student-login.php";
                    emailDisplay.textContent = "student_xxx@elibrary.com"; 
                } else {
                    backLink.textContent = "← Back to Admin Login";
                    backLink.href = "admin-login.php";
                    returnUrl = "admin-login.php";
                    emailDisplay.textContent = "admin_xxx@elibrary.com";
                }
            }
        };

        function goToOtpStep() {
            const newPass = document.getElementById('reset-new-password').value;
            const confirmPass = document.getElementById('reset-confirm-password').value;

            if(!newPass || !confirmPass) { alert("Please fill in both password fields!"); return; }
            if(newPass !== confirmPass) { alert("Passwords do not match!"); return; }

            document.getElementById('step-password').style.display = 'none';
            document.getElementById('step-otp').style.display = 'block';
            startTimer();
        }

        function startTimer() {
            timeLeft = 120; 
            document.getElementById('countdown').textContent = "02:00";
            document.getElementById('resend-btn').style.display = 'none';
            document.getElementById('timer-text').style.display = 'inline';

            clearInterval(countdownTimer);
            countdownTimer = setInterval(function() {
                timeLeft--;
                let minutes = Math.floor(timeLeft / 60);
                let seconds = timeLeft % 60;
                minutes = minutes < 10 ? '0' + minutes : minutes;
                seconds = seconds < 10 ? '0' + seconds : seconds;
                document.getElementById('countdown').textContent = minutes + ":" + seconds;

                if (timeLeft <= 0) {
                    clearInterval(countdownTimer);
                    document.getElementById('timer-text').style.display = 'none'; 
                    document.getElementById('resend-btn').style.display = 'inline-block'; 
                }
            }, 1000);
        }

        function resendOtpAction() {
            alert("A fresh OTP code has been successfully dispatched to your email");
            startTimer(); 
        }

        function verifyAndSubmit() {
            const otp = document.getElementById('otp-input').value.trim();
            if(!otp || otp.length < 4) { alert("Invalid OTP code!"); return; }
            document.getElementById('success-modal').style.display = 'flex';
        }

        function redirectAfterSuccess() { window.location.href = returnUrl; }
    </script>
</body>
</html>
