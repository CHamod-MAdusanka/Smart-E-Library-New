<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - Smart E-Library</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="top-bar">
        <a href="index.html">Home</a>
        <span class="divider">|</span>
        <a href="admin-login.html">Admin</a>
    </div>

    <div class="login-wrapper">
        <div class="login-box">
            <h2>Student Login</h2>
            
            <form id="studentLoginForm" action="php/auth_controller.php?action=student_login" method="POST">
                
                <div id="step-1">
                    <input type="text" name="studentId" id="studentId" placeholder="Student ID" oninput="this.value = this.value.replace(/[^a-zA-Z0-9\-]/g, '')" onpaste="return false;" ondrop="return false;" autocomplete="off" required>
                    <br>
                    <button type="button" class="login-btn" onclick="goToStep2()">Next</button>
                </div>

                <div id="step-2" style="display: none;">
                    <div id="display-id" style="font-weight: bold; color: #003366; margin-bottom: 15px; font-size: 16px;"></div>
                    
                    <input type="password" name="studentPassword" id="studentPassword" placeholder="Password" required>
                    <br>
                    <div class="forgot-password">
                        <a href="#" onclick="goToForgotPassword()">Forgot Password?</a>
                    </div>
                    <button type="submit" class="login-btn">Login</button>
                </div>

            </form>
            
            <div class="register-link" id="register-link-container">
                <p><a href="student-register.html">I don't have an account</a></p>
            </div>
        </div>
    </div>

    <script>
        function goToStep2() {
            const stuId = document.getElementById('studentId').value.trim().toUpperCase();
            
            const validPattern = /^[A-Z0-9\-]+$/;
            
            if(stuId === "") {
                alert("Please enter your Student ID first!");
                return;
            }
            
            if (!validPattern.test(stuId)) {
                alert("Security Alert: Invalid characters detected! Please use only letters, numbers, and hyphens (-).");
                return;
            }
            
            document.getElementById('display-id').textContent = "Hi, " + stuId;
            document.getElementById('step-1').style.display = 'none';
            document.getElementById('register-link-container').style.display = 'none'; 
            document.getElementById('step-2').style.display = 'block';
        }

        function goToForgotPassword() {
            const stuId = document.getElementById('studentId').value.trim().toUpperCase();
            window.location.href = "forgot-password.html?id=" + encodeURIComponent(stuId);
        }
    </script>
</body>
</html>
