<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - Smart E-Library</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@900&family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        .login-box select { 
            width: 100%; 
            padding: 14px; 
            margin-bottom: 20px; 
            border: 1px solid #E2E8F0; 
            background: #F8FAFC;
            border-radius: 6px; 
            font-size: 15px; 
            box-sizing: border-box; 
            transition: 0.3s;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
            cursor: pointer;
        }
        .login-box select:focus { 
            outline: none; 
            border-color: var(--accent-teal); 
            background: #fff;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="top-bar-content">
            <a href="index.html" class="btn" style="color: white; text-decoration: none; margin-right: 15px;">Home</a>
            <span class="divider">|</span>
            <a href="student-login.html" class="btn student-btn">Student</a>
            <span class="divider">|</span>
            <a href="admin-login.html" class="btn admin-btn">Admin</a>
        </div>
    </div>

    <div class="login-wrapper">
        <div class="login-box" style="width: 450px; margin-top: 60px; margin-bottom: 40px;">
            <h2 style="color: var(--bg-slate); margin-bottom: 5px;">Create Account</h2>
            <p style="color: #64748B; font-size: 14px; margin-bottom: 25px;">Register to access the Smart E-Library</p>
            
            <form id="studentRegisterForm" action="php/register_student.php" method="POST" enctype="multipart/form-data" onsubmit="return validateRegistration()">
                
                <div style="text-align: left;">
                    <label style="font-size: 13px; font-weight: bold; color: var(--bg-slate); display: block; margin-bottom: 5px;">First Name</label>
                    <input type="text" name="firstName" placeholder="First Name" required>
                </div>

                <div style="text-align: left;">
                    <label style="font-size: 13px; font-weight: bold; color: var(--bg-slate); display: block; margin-bottom: 5px;">Last Name</label>
                    <input type="text" name="lastName" placeholder="Last Name" required>
                </div>

                <div style="text-align: left;">
                    <label style="font-size: 13px; font-weight: bold; color: var(--bg-slate); display: block; margin-bottom: 5px;">Date of Birth</label>
                    <input type="date" name="dob" required>
                </div>

                <div style="text-align: left;">
                    <label style="font-size: 13px; font-weight: bold; color: var(--bg-slate); display: block; margin-bottom: 5px;">Gender</label>
                    <select name="gender" required>
                        <option value="" disabled selected>Select Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>

                <div style="text-align: left;">
                    <label style="font-size: 13px; font-weight: bold; color: var(--bg-slate); display: block; margin-bottom: 5px;">Email Address</label>
                    <input type="email" name="email" placeholder="Email" required>
                </div>

                <div style="text-align: left;">
                    <label style="font-size: 13px; font-weight: bold; color: var(--bg-slate); display: block; margin-bottom: 5px;">Phone Number</label>
                    <input type="tel" name="phone" placeholder="Phone Number" required>
                </div>

                <div style="text-align: left; margin-bottom: 10px;">
                    <label style="font-size: 13px; font-weight: bold; color: var(--bg-slate); display: block; margin-bottom: 5px;">Upload Birth Certificate (Proof)</label>
                    <input type="file" name="proofFile" accept=".pdf,.jpg,.jpeg,.png" style="padding: 10px; background: #F8FAFC; border: 1px dashed var(--accent-teal); cursor: pointer; width: 100%; box-sizing: border-box;" required>
                </div>

                <div style="text-align: left; margin-top: 20px;">
                    <label style="font-size: 13px; font-weight: bold; color: var(--bg-slate); display: block; margin-bottom: 5px;">Password</label>
                    <input type="password" name="password" id="regPassword" placeholder="Password" required>
                </div>

                <div style="text-align: left;">
                    <label style="font-size: 13px; font-weight: bold; color: var(--bg-slate); display: block; margin-bottom: 5px;">Confirm Password</label>
                    <input type="password" id="regConfirmPassword" placeholder="Confirm Password" required>
                </div>

                <button type="submit" class="login-btn" style="margin-top: 10px;">Register</button>

            </form>
            
            <div class="register-link">
                <p>Already have an account? <a href="student-login.html">Login Here</a></p>
            </div>
        </div>
    </div>

    <script>
        function validateRegistration() {
            const pass = document.getElementById('regPassword').value;
            const confirmPass = document.getElementById('regConfirmPassword').value;

            if (pass !== confirmPass) {
                alert("Passwords do not match! Please try again.");
                return false; // PHP එකට දත්ත යවන එක නතර කරනවා
            }

            if (pass.length < 6) {
                alert("Password must be at least 6 characters long.");
                return false; 
            }

            return true; // ඔක්කොම හරි නම් PHP ෆයිල් එකට දත්ත යවනවා
        }
    </script>
</body>
</html>
